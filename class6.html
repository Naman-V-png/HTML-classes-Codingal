<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <!--Forms-->
    <h1>Personal Details Form</h1>
    <form>
        <fieldset>
        <legend><u>Personal Information</u></legend>
        <label>Name</label><br>
        <input type="text"> <br><br>

        <label>Email ID</label><br>
        <input type="email"> <br><br>

        <label>Age</label><br>
        <input type="date"><br><br>

        <label>Contact Number (This will be hidden)</label><br>
        <input type="password"><br><br>

        <label>Gender</label><br><br>
        <input type="radio" id="female" name="gender" value="Female">Female<br>
        <input type="radio" id="male" name="gender" value="Male">Male<br>
        <input type="radio" id="Other" name="gender" value="Other">Prefer not to say<br><br>
        <label>Favourite City:</label><br><br>
        <input type="checkbox" id="city" value="New Delhi">New Delhi<br>
        <input type="checkbox" id="city" value="Mumbai">Mumbai<br><br>
        <input type="submit">
        </fieldset>
    </form><br><br>

    <!--Marks-->
    <fieldset>
        <legend>Enter your marks</legend>
        <form action="/action_page.php" oninput="x.value=(parseInt(m1.value)+parseInt(m2.value)+parseInt(m3.value))/3">
        <label>Name</label><br>
        <input type="text"><br><br>
        <label>Enter Marks</label><br>
        <select name="Subject" id="subject">
            <option value="Maths">Maths</option>
            <option value="English">English</option>
            <option value="Science">Science</option>
        </select>
        <input type="number" id="m1" name="m1"><br><br>
        <select name="Subject2" id="subject2">
            <option value="Maths">Maths</option>
            <option value="English">English</option>
            <option value="Science">Science</option>
        </select>
        <input type="number" id="m2" name="m2"><br><br>
        <select name="Subject3" id="subject3">
            <option value="Maths">Maths</option>
            <option value="English">English</option>
            <option value="Science">Science</option>
        </select>
        <input type="number" id="m3" name="m3"><br><br>
        Average: <output name="x" for="m1 m2 m3"></output>
        </form>
    </fieldset>
    </body>
</html>
