<!DOCTYPE html>

    <body>
        <!--Hyperlinking-->
        <h1>HTML Links</h1>
        <p>Let's get into a world of <a href="https://www.codingal.com/dashboard/">coding.</a></p>
        <br><br>
        <!--Lists-->
        <h2>An ordered HTML list:</h2>
        <ol>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
            <li>Fourth item</li>
        </ol>
        <br>
        <h2>An unordered HTML list:</h2>
        <ul>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
        </ul>
        <!--Table-->
        <br><br>
        <h2>Table</h2>
        <table border="2"bgcolor=lightblue>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Grade</th>
                <th>Marks</th>
            </tr>
            <tr>
                <td>Naman</td>
                <td>13</td>
                <td>8</td>
                <td>100%</td>
            </tr>
            <tr>
                <td>Siana</td>
                <td>5</td>
                <td>1</td>
                <td>75%</td>
            </tr>
            <tr>
                <td>Hridaan</td>
                <td>13</td>
                <td>8</td>
                <td>50%</td>
            </tr>
            <tr>
                <td>Krishna</td>
                <td>13</td>
                <td>8</td>
                <td>0%</td>
            </tr>
        </table>
    </body>
</html>
