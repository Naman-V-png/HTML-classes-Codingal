<!DOCTYPE html>
<html>
    <head>
        <style>
            .text1 {
                color:red;
                font-size:30px;
            }
            .p1 {
                color: blueviolet;
                font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            }
            div {
                width: 300px;
                height: 100px;
                background-color: yellow;
                border: 1px solid black;
            }
            #myDiv {
                transform: rotateX(180deg);
            }
            h1 {
            text-decoration: overline;
            text-transform: capitalize;
            }
            h2 {
                text-decoration: line-through;
                text-transform: uppercase;
            }
            h3 {
                text-decoration: underline;
                text-transform: lowercase;
            }
            h4 {
                text-decoration: underline overline;
                text-transform: none;
            }
            *{
                text-align: center;
                font-family: monospace;
            }
            #text{
                text-shadow: 2px 2px 1px #CC5500;
                
            }
            #box {
                box-shadow: 9px 9px 5px #301934;
            }
            #indent {
                text-indent: 50%; 
            }
        </style>
    </head>
    <body>
        <h1>Typography</h1>
        <p class="text1">Welcome to Codingal</p>
        <p class="p1">Welcome to Codingal</p>

        <br>
        <h1>Transform</h1>
        <div>
            Codingal
        </div>
        <div id="myDiv">
            Codingal
        </div>
        
        <br>
        <b>Text Decoration</b>

        <h1>codingal</h1>
        <h2>codingal</h2>
        <h3>CODINGAL</h3>
        <h4>CODINGAL</h4>

        <br>
        <i>Text shadow, box shadow and text indent</i>
        <br><br>
        <i id="text">Shadow for the text!</i>
        <br><br>
        <i id="box">Shadow for the element!</i>
        <br><br>
        <footer>
            <p>Text indent example</p>
            <p id="indent">Text indent example</p>
        <footer>
    </body>
</html>
